services:
  # Web Service
  - type: web
    name: karima-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build:production && bash scripts/seed-if-empty.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        fromDatabase:
          name: karima-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: karima-db
    plan: starter
    region: oregon
    ipAllowList: []
